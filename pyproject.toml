[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engrag*"]

[project]
name = "eng-rag-assistant"
version = "0.1.0"
description = "A retrieval-augmented engineering knowledge assistant with a small tool-using agent and an eval harness"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
